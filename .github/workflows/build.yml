name: Build Windows installer

on:
  workflow_dispatch:
    inputs:
      release:
        description: "发布到 Releases（需要填版本号，例如 v1.1.3）"
        required: false
        type: string
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Check release tag matches VERSION
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/','' } else { '${{ inputs.release }}' }
          if (($tag -replace '^[vV]','') -ne $version) {
            throw "Release tag '$tag' does not match VERSION '$version'. Update VERSION first so the in-app updater can find the installer."
          }

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { throw "ISCC not found at $iscc" }
          Write-Host "ISCC: $iscc"

      - name: Build installer
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/build_release.ps1 -Iscc $iscc -NoOpen

      - name: Show self-test report on failure
        if: failure()
        run: |
          $report = 'work/package/logs/exe-check.json'
          if (Test-Path $report) { Get-Content $report -Raw }
          Get-ChildItem work/package/logs -ErrorAction SilentlyContinue |
            ForEach-Object {
              Write-Host "===== $($_.Name) ====="
              Get-Content $_.FullName -Tail 40
            }

      - name: Verify output
        run: |
          $exe = Get-ChildItem dist/installer/DeskIsle-Setup-*.exe -ErrorAction Stop
          Write-Host "Installer: $($exe.FullName)"
          Write-Host "Size: $([math]::Round($exe.Length / 1MB, 1)) MB"
          Get-ChildItem dist/installer | Select-Object Name, Length

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskIsle-installer
          path: |
            dist/installer/DeskIsle-Setup-*.exe
            dist/installer/DeskIsle-Setup-*.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = if ($env:GITHUB_REF -like 'refs/tags/*') { $env:GITHUB_REF -replace '^refs/tags/','' } else { '${{ inputs.release }}' }
          if (-not $tag) { throw 'Release tag is empty.' }
          Write-Host "Publishing $tag"
          $files = Get-ChildItem dist/installer/DeskIsle-Setup-* | ForEach-Object { $_.FullName }
          gh release create $tag $files --title "桌屿 DeskIsle $tag" --generate-notes
